name: Daily market-data refresh
on:
  schedule:
    # Weekdays after the US market close (21:30 UTC ≈ 17:30 ET)
    - cron: "30 21 * * 1-5"
  workflow_dispatch:
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh ETF history (Nasdaq) + news snapshot (Fed/ECB/CNBC)
        run: |
          python3 scripts/fetch_history.py
          python3 scripts/refresh_news.py
      - name: Send news-digest emails
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        run: python3 scripts/news_alerts.py
      - name: Commit updated snapshots
        run: |
          git config user.name "etf-bot"
          git config user.email "etf-bot@users.noreply.github.com"
          git add data/history data/news-daily.json data/etf-news.json
          git diff --cached --quiet || git commit -m "Daily market data refresh"
          git push
