name: Watched-ETF news refresh
on:
  schedule:
    # Hourly on weekdays while markets are open (fresh web news for watched funds)
    - cron: "15 13-21 * * 1-5"
  workflow_dispatch:
jobs:
  favscan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rescan web news for watched ETFs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 scripts/refresh_news.py --favs-only
      - name: Commit updated scan
        run: |
          git config user.name "etf-bot"
          git config user.email "etf-bot@users.noreply.github.com"
          git add data/etf-news.json
          git diff --cached --quiet || git commit -m "Hourly watched-ETF news refresh"
          # Retry push: GitHub occasionally rejects pushes transiently
          # ("fatal error in commit_refs_rules" infra blips). Next hourly run
          # rescans and would push the same fresh data anyway.
          ok=0
          for i in 1 2 3 4; do
            if git push; then ok=1; break; fi
            echo "Push attempt $i rejected — retrying in 30 s"
            git pull --rebase origin main || true
            sleep 30
          done
          [ "$ok" = "1" ] || { echo "::warning::Push rejected after 4 attempts — GitHub-side; the next scheduled run will retry."; exit 1; }
