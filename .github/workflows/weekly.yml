name: Weekly universe refresh
on:
  schedule:
    # Sundays after the week's US close data settles
    - cron: "5 22 * * 0"
  workflow_dispatch:
jobs:
  universe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh ETF universe (drop dead listings, admit candidates)
        run: python3 scripts/refresh_universe.py
      - name: Commit updated universe
        run: |
          git config user.name "etf-bot"
          git config user.email "etf-bot@users.noreply.github.com"
          git add data/universe.json data/tickers.txt assets/universe.js data/retired.json data/universe-report.json
          git diff --cached --quiet || git commit -m "Weekly universe refresh"
          ok=0
          for i in 1 2 3 4; do
            if git push; then ok=1; break; fi
            echo "Push attempt $i rejected — retrying in 30 s"
            git pull --rebase origin main || true
            sleep 30
          done
          [ "$ok" = "1" ] || { echo "::warning::Push rejected after 4 attempts — GitHub-side; the next scheduled run will retry."; exit 1; }
